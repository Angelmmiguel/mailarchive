# Publishes the container image to this repository's GitHub Container
# Registry package. The Dockerfile builds the web app and the binary itself,
# so nothing here depends on the CI workflow.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a publish half-way; queue instead.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main publishes `latest`; a v* tag publishes the semver tags and moves
      # `latest` to the release. The package name must be lower case, which
      # the owner's login is not.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/angelmmiguel/mailarchive
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # linux/amd64 only, the platform Unraid runs, as `just image` builds.
      # Provenance is off so the package holds one image per tag rather than
      # an index with an attestation beside it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
